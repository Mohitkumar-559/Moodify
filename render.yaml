# Render Blueprint — free-tier deploy of the API, web client, and Postgres.
# Render dashboard → New → Blueprint → pick this repo. See README "Deploy to Render".
databases:
  - name: moodify-db
    plan: free
    databaseName: moodify
    user: moodify

services:
  - type: web
    name: moodify-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python scripts/download_demo_tracks.py
    # Free tier has no pre-deploy command or shell, so migrations/seed/admin
    # bootstrap run on every boot (all idempotent).
    startCommand: bash scripts/render_start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DATABASE_URL
        fromDatabase:
          name: moodify-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      # Optional: set both in the dashboard to bootstrap an /admin login.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: moodify-web
    runtime: static
    rootDir: app
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: dist
    envVars:
      # Bare hostname (no scheme) — app/src/api/client.ts adds https://.
      - key: EXPO_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: moodify-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

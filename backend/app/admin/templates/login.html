<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Moodify Admin — Log in</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #14121F;
      color: #F5F3F7;
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    }
    form {
      background: #1E1B2E;
      border: 1px solid #322D45;
      border-radius: 12px;
      padding: 32px;
      width: 320px;
    }
    h1 { font-size: 18px; margin: 0 0 20px; }
    label { display: block; font-size: 13px; color: #9A94AA; margin: 14px 0 4px; }
    input {
      width: 100%;
      padding: 9px 10px;
      border-radius: 6px;
      border: 1px solid #322D45;
      background: #14121F;
      color: #F5F3F7;
      font-size: 14px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 10px;
      border-radius: 6px;
      border: none;
      background: #FF6B4A;
      color: #14121F;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .error { color: #FF6B4A; font-size: 13px; margin-top: 12px; }
  </style>
</head>
<body>
  <form method="post" action="/admin/login">
    <h1>Moodify Admin</h1>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required autofocus />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required />
    {% if error %}<div class="error">Incorrect email/password, or this account isn't an admin.</div>{% endif %}
    <button type="submit">Log in</button>
  </form>
</body>
</html>
